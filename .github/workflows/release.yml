name: Release PlataSistem

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Omogućava ručno pokretanje iz Actions taba

permissions:
  contents: write # Dozvola da GitHub Action kreira Release

jobs:
  # Kapija kvaliteta: build i testovi moraju proći pre nego što se bilo šta objavi.
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prevođenje celog rešenja
        run: dotnet build PlataSistem.slnx -c Release

      - name: Pokretanje testova
        run: dotnet test PlataApp.Tests\PlataApp.Tests.csproj -c Release --no-build --verbosity normal

  build:
    needs: test
    # Na pull request-u se samo prevodi - release se objavljuje tek kad kod uđe u main.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Čitanje verzije iz fajla
        id: get_version
        # Jedini version.txt u repou — isti onaj iz kog PlataApp.csproj čita verziju
        # ugrađenu u .exe. Ranije su postojala dva na različitim nivoima, pa su se
        # verzija binarnog fajla i verzija Velopack paketa mogle raziću.
        run: |
          $ver = (Get-Content version.txt).Trim()
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Prevođenje koda (dotnet publish)
        run: |
          dotnet publish PlataApp\PlataApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$env:VERSION -o publish_output

      - name: Kopiranje baza i help fajlova
        run: |
          if (Test-Path "plata.db") { Copy-Item -Path "plata.db" -Destination "publish_output\plata.db" -Force }
          
          if (Test-Path "PlataApp\Resources\Help") {
              New-Item -ItemType Directory -Path "publish_output\Resources\Help" -Force | Out-Null
              Copy-Item -Path "PlataApp\Resources\Help\*" -Destination "publish_output\Resources\Help" -Recurse -Force
          }


      - name: Instalacija Velopack CLI
        run: dotnet tool install -g vpk


      - name: Pakovanje (vpk pack)
        run: |
          $iconPath = "PlataApp\plata.ico"
          $vpkArgs = @(
              "pack",
              "--packId", "PlataSistem",
              "--packVersion", $env:VERSION,
              "--packDir", "publish_output",
              "--mainExe", "PlataApp.exe",
              "--outputDir", "ReleasePackage",
              "--packTitle", "ERPi Zarade"
          )
          
          if (Test-Path $iconPath) {
              $vpkArgs += "--icon"
              $vpkArgs += $iconPath
          }
          
          & vpk $vpkArgs

      - name: Objavljivanje na GitHub Releases
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --publish --releaseName "$env:VERSION" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir "ReleasePackage"
